# P1 detection logic — Splunk (same logic as elastic/queries.esql)
# Import into $SPLUNK_HOME/etc/apps/ai_security/local/savedsearches.conf
# or paste each search into the UI and save as an alert.

[AI - Canary token leaked in output or URL]
search = index=ai_app sourcetype=supportbot earliest=-24h \
| eval hit=if(match(response_text, "CANARY-7f3a91c2") OR match(url_full, "CANARY-7f3a91c2"), 1, 0) \
| where hit=1 \
| eval severity=if(match(url_full, "CANARY-7f3a91c2"), "critical", "high") \
| table _time, user, session_id, app, severity, url_domain, url_full
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4

[AI - Chat template delimiter spoofing]
search = index=ai_app sourcetype=supportbot earliest=-24h \
| eval blob=coalesce(prompt_text, "") . " " . coalesce(retrieved_text, "") \
| where match(blob, "(?i)(</?system>|###\s*(SYSTEM|USER|ASSISTANT)\b|\[INST\])") \
| table _time, user, session_id, app, prompt_text
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 3

[AI - Suspicious prompt then privileged tool call]
search = index=ai_app sourcetype=supportbot earliest=-24h \
| eval suspicious=if(match(prompt_text, "(?i)(ignore|disregard|forget)\b.{0,40}\b(previous|above|earlier|instructions)") OR match(prompt_text, "(?i)(new instructions|repeat everything|verbatim|unrestricted)"), 1, 0) \
| eval tool=if(match(tool_calls, "(?i)(fetch_url|send_email|http_request|write_file|run_sql)"), 1, 0) \
| stats sum(suspicious) AS sus, sum(tool) AS tools, values(prompt_text) AS prompts BY session_id, user \
| where sus > 0 AND tools > 0 \
| table session_id, user, sus, tools, prompts
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4

[AI - Extraction intent in query]
search = index=ai_app sourcetype=supportbot earliest=-24h \
| where match(prompt_text, "(?i)(system prompt|your instructions|repeat (the )?words above|repeat everything|configuration|maintenance mode|verbatim|translate your|read out|reveal|debug ?bot|decode (this|the following)|supersedes)") \
| table _time, user, session_id, prompt_text
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 3

[AI - Instruction-like text in retrieved chunk]
search = index=ai_app sourcetype=supportbot earliest=-24h \
| where match(retrieved_text, "(?i)(assistant instruction|ignore (all |any )?(of )?(the )?previous|do not mention|you must|supersedes|highest priority)") \
| table _time, user, session_id, retrieved_ids, retrieved_text
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4

# ── Shadow AI (module 04 lesson 4) ──────────────────────────────────────────
[Shadow AI - first contact with unsanctioned AI service]
search = index=proxy OR index=dns earliest=-7d \
| eval dom=lower(coalesce(url_domain, query)) \
| lookup ai_domains dom OUTPUT ai_service \
| where isnotnull(ai_service) \
| lookup ai_approved_domains dom OUTPUT approved \
| where isnull(approved) \
| stats min(_time) AS first_seen, count AS hits, sum(bytes_out) AS uploaded BY src_user, dom \
| where first_seen > relative_time(now(), "-24h") \
| sort - uploaded
cron_schedule = 0 7 * * *
enableSched = 1
alert.severity = 2

# ── Token anomaly / denial of wallet ───────────────────────────────────────
[AI - Token spend anomaly per user]
search = index=ai_app sourcetype=supportbot earliest=-7d \
| bin _time span=1h \
| stats sum(prompt_tokens) AS tin, sum(completion_tokens) AS tout, count AS reqs BY _time, user \
| eventstats median(tin) AS med, stdev(tin) AS sd BY user \
| eval z=if(sd > 0, (tin - med) / sd, 0) \
| where z > 4 AND tin > 50000 \
| table _time, user, reqs, tin, tout, z
cron_schedule = 15 * * * *
enableSched = 1
alert.severity = 3
